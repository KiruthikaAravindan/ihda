<svg xmlns="http://www.w3.org/2000/svg" width="860" height="655" viewBox="0 0 860 655">
  <defs>
    <!-- Arrowhead: maintainer gold -->
    <marker id="ah-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD700" fill-opacity="0.65"/>
    </marker>
    <!-- Arrowhead: collaborator purple -->
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bb88ff" fill-opacity="0.65"/>
    </marker>
    <!-- Arrowhead: merge green -->
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#44cc88" fill-opacity="0.8"/>
    </marker>
  </defs>

  <!-- ── Background ──────────────────────────────────── -->
  <rect width="860" height="655" fill="#0c1a35"/>

  <!-- faint star-field dots -->
  <circle cx="52"  cy="20"  r="1" fill="#ffffff" opacity="0.18"/>
  <circle cx="180" cy="10"  r="1" fill="#ffffff" opacity="0.12"/>
  <circle cx="310" cy="26"  r="1" fill="#ffffff" opacity="0.15"/>
  <circle cx="560" cy="14"  r="1" fill="#ffffff" opacity="0.13"/>
  <circle cx="720" cy="22"  r="1" fill="#ffffff" opacity="0.18"/>
  <circle cx="820" cy="8"   r="1" fill="#ffffff" opacity="0.11"/>
  <circle cx="840" cy="38"  r="1" fill="#ffffff" opacity="0.14"/>
  <circle cx="20"  cy="44"  r="1" fill="#ffffff" opacity="0.10"/>

  <!-- ── Title ──────────────────────────────────────── -->
  <text x="430" y="36" text-anchor="middle"
        fill="#FFD700" font-size="14" font-family="'Courier New', Courier, monospace"
        font-weight="bold" letter-spacing="3">♪  CONTRIBUTION WORKFLOW  ♪</text>
  <line x1="210" y1="46" x2="650" y2="46" stroke="#FFD700" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ── Lane headers ───────────────────────────────── -->
  <!-- Maintainer -->
  <rect x="40" y="58" width="300" height="30" rx="4"
        fill="#FFD700" fill-opacity="0.07" stroke="#FFD700" stroke-opacity="0.22" stroke-width="1"/>
  <text x="190" y="78" text-anchor="middle"
        fill="#FFD700" font-size="11" font-family="'Courier New', Courier, monospace"
        font-weight="bold" letter-spacing="1.5">YOU  (MAINTAINER)</text>

  <!-- Collaborator -->
  <rect x="520" y="58" width="300" height="30" rx="4"
        fill="#bb88ff" fill-opacity="0.07" stroke="#bb88ff" stroke-opacity="0.22" stroke-width="1"/>
  <text x="670" y="78" text-anchor="middle"
        fill="#cc99ff" font-size="11" font-family="'Courier New', Courier, monospace"
        font-weight="bold" letter-spacing="1.5">COLLABORATORS</text>

  <!-- Centre divider -->
  <line x1="430" y1="58" x2="430" y2="580"
        stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="3 8"/>

  <!-- ═══════════════════════════════════════════════
       MAINTAINER NODES  (center x=190, left=70, w=240, h=40, rx=6)
       M1 top=105  M2 top=185  M3 top=265  M4 top=345
  ════════════════════════════════════════════════ -->

  <!-- M1 — branch -->
  <rect x="70" y="105" width="240" height="40" rx="6"
        fill="#111c30" stroke="#FFD700" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="70" y="105" width="4" height="40" rx="2" fill="#FFD700" fill-opacity="0.55"/>
  <text x="196" y="121" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">git switch -c feat/…</text>
  <text x="196" y="136" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">create branch off main</text>

  <!-- M1 → M2 -->
  <line x1="190" y1="145" x2="190" y2="181"
        stroke="#FFD700" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-gold)"/>

  <!-- M2 — code & test -->
  <rect x="70" y="185" width="240" height="40" rx="6"
        fill="#111c30" stroke="#FFD700" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="70" y="185" width="4" height="40" rx="2" fill="#FFD700" fill-opacity="0.55"/>
  <text x="196" y="201" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">code + play-test locally</text>
  <text x="196" y="216" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">npx http-server, open browser</text>

  <!-- M2 → M3 -->
  <line x1="190" y1="225" x2="190" y2="261"
        stroke="#FFD700" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-gold)"/>

  <!-- M3 — open PR -->
  <rect x="70" y="265" width="240" height="40" rx="6"
        fill="#111c30" stroke="#FFD700" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="70" y="265" width="4" height="40" rx="2" fill="#FFD700" fill-opacity="0.55"/>
  <text x="196" y="281" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">git push → open PR</text>
  <text x="196" y="296" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">fill the PR template</text>

  <!-- M3 → M4 -->
  <line x1="190" y1="305" x2="190" y2="341"
        stroke="#FFD700" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-gold)"/>

  <!-- M4 — approve & merge -->
  <rect x="70" y="345" width="240" height="40" rx="6"
        fill="#111c30" stroke="#FFD700" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="70" y="345" width="4" height="40" rx="2" fill="#FFD700" fill-opacity="0.55"/>
  <text x="196" y="361" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">self-review + approve</text>
  <text x="196" y="376" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">squash-merge, branch deleted</text>

  <!-- M4 → shared  (curve right-and-down) -->
  <path d="M 190 385 C 190 500 340 578 430 582"
        stroke="#FFD700" stroke-opacity="0.4" stroke-width="1.5"
        fill="none" marker-end="url(#ah-green)"/>

  <!-- ═══════════════════════════════════════════════
       COLLABORATOR NODES  (center x=670, left=550, w=240, h=40, rx=6)
       C1 top=105  C2 top=185  C3 top=265  C4 top=345  C5 top=425  C6 top=505
  ════════════════════════════════════════════════ -->

  <!-- C1 — request access -->
  <rect x="550" y="105" width="240" height="40" rx="6"
        fill="#111c30" stroke="#bb88ff" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="786" y="105" width="4" height="40" rx="2" fill="#bb88ff" fill-opacity="0.55"/>
  <text x="676" y="121" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">request collaborator access</text>
  <text x="676" y="136" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">maintainer adds via Settings</text>

  <!-- C1 → C2 -->
  <line x1="670" y1="145" x2="670" y2="181"
        stroke="#bb88ff" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-purple)"/>

  <!-- C2 — clone / pull -->
  <rect x="550" y="185" width="240" height="40" rx="6"
        fill="#111c30" stroke="#bb88ff" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="786" y="185" width="4" height="40" rx="2" fill="#bb88ff" fill-opacity="0.55"/>
  <text x="676" y="201" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">clone / git pull main</text>
  <text x="676" y="216" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">get the latest code</text>

  <!-- C2 → C3 -->
  <line x1="670" y1="225" x2="670" y2="261"
        stroke="#bb88ff" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-purple)"/>

  <!-- C3 — branch -->
  <rect x="550" y="265" width="240" height="40" rx="6"
        fill="#111c30" stroke="#bb88ff" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="786" y="265" width="4" height="40" rx="2" fill="#bb88ff" fill-opacity="0.55"/>
  <text x="676" y="281" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">git switch -c feat/…</text>
  <text x="676" y="296" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">create branch off main</text>

  <!-- C3 → C4 -->
  <line x1="670" y1="305" x2="670" y2="341"
        stroke="#bb88ff" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-purple)"/>

  <!-- C4 — code & test -->
  <rect x="550" y="345" width="240" height="40" rx="6"
        fill="#111c30" stroke="#bb88ff" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="786" y="345" width="4" height="40" rx="2" fill="#bb88ff" fill-opacity="0.55"/>
  <text x="676" y="361" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">code + play-test locally</text>
  <text x="676" y="376" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">npx http-server, open browser</text>

  <!-- C4 → C5 -->
  <line x1="670" y1="385" x2="670" y2="421"
        stroke="#bb88ff" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-purple)"/>

  <!-- C5 — open PR -->
  <rect x="550" y="425" width="240" height="40" rx="6"
        fill="#111c30" stroke="#bb88ff" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="786" y="425" width="4" height="40" rx="2" fill="#bb88ff" fill-opacity="0.55"/>
  <text x="676" y="441" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">git push → open PR</text>
  <text x="676" y="456" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">fill the PR template</text>

  <!-- C5 → C6 -->
  <line x1="670" y1="465" x2="670" y2="501"
        stroke="#bb88ff" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#ah-purple)"/>

  <!-- C6 — maintainer reviews -->
  <rect x="550" y="505" width="240" height="40" rx="6"
        fill="#111c30" stroke="#bb88ff" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="786" y="505" width="4" height="40" rx="2" fill="#bb88ff" fill-opacity="0.55"/>
  <text x="676" y="521" text-anchor="middle"
        fill="#dde4f0" font-size="11" font-family="'Courier New', Courier, monospace">maintainer reviews + approves</text>
  <text x="676" y="536" text-anchor="middle"
        fill="#778899" font-size="10" font-family="'Courier New', Courier, monospace">squash-merge, branch deleted</text>

  <!-- C6 → shared  (curve left-and-down) -->
  <path d="M 670 545 C 670 572 560 580 430 582"
        stroke="#bb88ff" stroke-opacity="0.4" stroke-width="1.5"
        fill="none" marker-end="url(#ah-green)"/>

  <!-- ═══════════════════════════════════════════════
       SHARED BOTTOM NODE — main updated
  ════════════════════════════════════════════════ -->
  <rect x="180" y="582" width="500" height="44" rx="7"
        fill="#0d2218" stroke="#44cc88" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- green left accent -->
  <rect x="180" y="582" width="5" height="44" rx="3" fill="#44cc88" fill-opacity="0.7"/>
  <!-- green right accent -->
  <rect x="675" y="582" width="5" height="44" rx="3" fill="#44cc88" fill-opacity="0.7"/>

  <text x="430" y="600" text-anchor="middle"
        fill="#44cc88" font-size="12" font-family="'Courier New', Courier, monospace"
        font-weight="bold">main updated</text>
  <text x="430" y="617" text-anchor="middle"
        fill="#33aa66" font-size="10" font-family="'Courier New', Courier, monospace"
        letter-spacing="0.5">GitHub Pages redeploys  ✓</text>

  <!-- ── Footer note ────────────────────────────────── -->
  <text x="430" y="643" text-anchor="middle"
        fill="#445566" font-size="9" font-family="'Courier New', Courier, monospace"
        letter-spacing="1">main is always deployable  ·  squash merge only  ·  branches auto-deleted</text>
</svg>
